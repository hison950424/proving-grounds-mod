plugins {
    id 'net.minecraftforge.gradle' version '[6.0,6.2)'
}

version = project.mod_version // 唯一來源：gradle.properties 的 mod_version
group = 'com.provinggrounds'
archivesBaseName = 'provinggrounds'

java {
    toolchain.languageVersion = JavaLanguageVersion.of(17)
}

// 原始碼一律以 UTF-8 編譯。Java 17 在繁中 Windows 預設用 CP950，
// 不指定的話中文字串（設定註解、訊息）會變成亂碼。
tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

minecraft {
    mappings channel: 'official', version: '1.20.1'

    runs {
        // 外部模組的 Mixin 在開發環境需要重新對應名稱
        configureEach {
            // 我們自己的 Mixin（正式 jar 由 manifest 的 MixinConfigs 載入，開發環境要用參數指定）
            arg '-mixin.config=provinggrounds.mixins.json'
            property 'mixin.env.remapRefMap', 'true'
            property 'mixin.env.refMapRemappingFile', "${projectDir}/build/createSrgToMcp/output.srg"
        }
        server {
            workingDirectory project.file('run')
            property 'forge.logging.markers', 'REGISTRIES'
            property 'forge.logging.console.level', 'debug'
            mods {
                provinggrounds {
                    source sourceSets.main
                }
            }
        }
        client {
            workingDirectory project.file('run')
            property 'forge.logging.markers', 'REGISTRIES'
            property 'forge.logging.console.level', 'debug'
            mods {
                provinggrounds {
                    source sourceSets.main
                }
            }
        }
    }
}

repositories {
    maven { url = 'https://maven.minecraftforge.net' }
    // 本機 libs 資料夾：放 TACZ、LR Tactical 等外部模組 jar（不上傳 git）
    flatDir { dirs 'libs' }
}

dependencies {
    minecraft 'net.minecraftforge:forge:1.20.1-47.3.0'

    // 測試環境載入槍械模組（只在執行時用；我們的程式透過反射接 TACZ，編譯不需要它）。
    // fg.deobf 會把正式版 jar 轉成開發環境的名稱，直接丟進 run/mods 會開不起來。
    // 加上 -PnoGunMods 可以不載入槍械模組，測試「移除 TACZ 與 lrtactical 後仍能啟動」（計畫書 C）
    if (!project.hasProperty('noGunMods')) {
        runtimeOnly fg.deobf('blank:tacz-1.20.1:1.1.8-hotfix')
        runtimeOnly fg.deobf('blank:lrtactical-1.20.1:0.4.3')
    }

    // Mixin 註解（Forge 執行時已內建 Mixin，只有編譯時需要）
    compileOnly 'org.spongepowered:mixin:0.8.5'

    // 單元測試（例如玩家資料舊存檔遷移，計畫書 B5）
    testImplementation 'org.junit.jupiter:junit-jupiter:5.10.2'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher:1.10.2'
}

test {
    useJUnitPlatform()
}

jar {
    manifest {
        attributes([
            'Specification-Title'     : 'provinggrounds',
            'Specification-Vendor'    : 'provinggrounds',
            'Specification-Version'   : '1',
            'Implementation-Title'    : project.name,
            'Implementation-Version'  : project.jar.archiveVersion,
            'Implementation-Vendor'   : 'provinggrounds',
            'Implementation-Timestamp': new Date().format("yyyy-MM-dd'T'HH:mm:ssZ"),
            'MixinConfigs'            : 'provinggrounds.mixins.json'
        ])
    }
}

// ── 計畫書 C：強制隔離槍械模組 ─────────────────────────────────────────────
// com.tacz 與 com.lrtactical 的 import 只能出現在 compat/ 底下（槍械適配層），其他地方一律透過 GunAdapter／GunCompat。
// 違反時建置失敗，並列出檔案與行號。
tasks.register('checkGunModIsolation') {
    group = 'verification'
    description = '檢查 com.tacz / com.lrtactical 的 import 只出現在 compat/ 底下'
    def srcDir = file('src/main/java')
    inputs.dir(srcDir)
    doLast {
        def violations = []
        def pattern = ~/^\s*import\s+(static\s+)?com\.(tacz|lrtactical)\./
        srcDir.eachFileRecurse(groovy.io.FileType.FILES) { f ->
            if (!f.name.endsWith('.java')) return
            def rel = srcDir.toPath().relativize(f.toPath()).toString().replace(File.separator, '/')
            if (rel.startsWith('com/provinggrounds/compat/')) return
            f.readLines('UTF-8').eachWithIndex { line, i ->
                if (line =~ pattern) violations << "${rel}:${i + 1}: ${line.trim()}"
            }
        }
        if (!violations.isEmpty()) {
            throw new GradleException("槍械模組的 import 只能放在 compat/ 底下：\n  " + violations.join('\n  '))
        }
    }
}
tasks.named('check') { dependsOn 'checkGunModIsolation' }
tasks.named('compileJava') { dependsOn 'checkGunModIsolation' }
